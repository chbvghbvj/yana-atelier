<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Сияна — Yana Atelier</title><meta name="description" content="Сияна — индивидуално изработена вечерна рокля от Yana Atelier, Пловдив."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--paper:#f7f5f1;--ink:#171614;--muted:#77736d;--line:#d9d5ce;--accent:#9b8067}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.nav{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.brand{font-family:'Playfair Display',serif;font-size:22px;letter-spacing:.04em;text-transform:none}.back{color:var(--muted)}main{padding:5vw}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:7vw;align-items:start}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{aspect-ratio:3/4;background:#e7e0d7;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#857b70;font:24px 'Playfair Display',serif}.photo:first-child{grid-column:span 2;aspect-ratio:4/5}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(46px,6vw,82px)/.98 'Playfair Display',serif;letter-spacing:-.04em;margin:20px 0}.price{font-size:14px;margin:24px 0}.desc{font-size:13px;line-height:1.9;color:var(--muted);max-width:390px}.cta{display:inline-block;margin-top:24px;padding:15px 22px;background:var(--ink);color:white;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.details{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--muted)}footer{padding:28px 5vw;border-top:1px solid var(--line);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}@media(max-width:700px){.nav{height:64px}main{padding:24px 5vw}.layout{grid-template-columns:1fr;gap:35px}.gallery{gap:8px}h1{font-size:58px}footer{gap:15px;flex-wrap:wrap}}
</style></head><body><header class="nav"><a class="brand" href="index.html">Yana Atelier</a><a class="back" href="index.html#collection">← Колекция</a></header><main><div class="layout" id="detail"><p>Зареждане…</p></div></main><footer><a class="brand" href="index.html">Yana Atelier</a><span>Пловдив, България</span></footer><script>
(async()=>{const base='/yana-atelier/';const asset=p=>!p?'':(/^https?:\/\//i.test(p)?p:(p.startsWith('/')?base+p.replace(/^\/+/, ''):base+p));try{const res=await fetch(base+'content/catalog.json',{cache:'no-store'});if(!res.ok)throw new Error('Catalog HTTP '+res.status);const data=await res.json();const slug=new URLSearchParams(location.search).get('slug');const item=(data.dresses||[]).find(d=>d.slug===slug);const root=document.getElementById('detail');if(!item){root.innerHTML='<p>Моделът не е намерен. <a href="'+base+'">Назад към колекцията</a></p>';return;}document.title=item.name+' — Yana Atelier';const image=item.image?'<img src="'+asset(item.image)+'" alt="'+item.name+'" style="width:100%;height:100%;object-fit:cover">':'<div class="photo">Снимката скоро</div>';root.innerHTML='<div class="photo">'+image+'</div><div><div class="eyebrow">Yana Atelier · Пловдив</div><h1>'+item.name+'</h1><div class="eyebrow">'+(item.category||'Вечерна рокля')+' · Индивидуална изработка</div><div class="price">'+item.price+' €</div><p class="desc">'+(item.longDescription||item.description||'Рокля, създадена индивидуално по твоите мерки.')+'</p><a class="cta" href="'+(data.site?.bookingUrl||'https://www.instagram.com/')+'" target="_blank" rel="noreferrer">Запиши час за консултация ↗</a><div class="details">Изработка по поръчка<br>Индивидуално напасване<br>За информация и записване — свържи се с ателието</div></div>';}catch(e){console.error(e);document.getElementById('detail').innerHTML='<p>Не удалось загрузить каталог. <a href="'+base+'">Назад</a></p>';}})();
</script><script>
