<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yana Atelier — Рокля</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--paper:#f7f5f1;--ink:#171614;--muted:#77736d;--line:#d9d5ce;--accent:#9b8067}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.nav{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.brand{font:22px 'Playfair Display',serif;letter-spacing:.04em;text-transform:none}.back{color:var(--muted)}main{padding:5vw}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:7vw;align-items:start}.photo{background:#e7e0d7;min-height:0;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain!important;object-position:center!important;background:#e7e0d7;display:block}.gallery{display:grid;gap:12px}.gallery-main{position:relative}.gallery-controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}.gallery-controls button{border:1px solid var(--line);background:transparent;padding:8px 14px;cursor:pointer}.gallery-thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.gallery-thumbs button{width:62px;height:76px;flex:0 0 auto;border:1px solid var(--line);padding:0;background:#e7e0d7;cursor:pointer}.gallery-thumbs img{width:100%;height:100%;object-fit:contain}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(46px,6vw,82px)/.98 'Playfair Display',serif;letter-spacing:-.04em;margin:20px 0}.price{font-size:14px;margin:24px 0}.desc{font-size:13px;line-height:1.9;color:var(--muted);max-width:390px}.cta{display:inline-block;margin-top:24px;padding:15px 22px;background:var(--ink);color:white;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.details{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--muted)}footer{padding:28px 5vw;border-top:1px solid var(--line);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}@media(max-width:700px){.nav{height:64px}main{padding:24px 5vw}.layout{grid-template-columns:1fr;gap:35px}h1{font-size:58px}footer{gap:15px;flex-wrap:wrap}}</style></head><body><header class="nav"><a class="brand" href="index.html">Yana Atelier</a><a class="back" href="index.html#collection">← Колекция</a></header><main><div class="layout" id="detail"><p>Зареждане…</p></div></main><footer><a class="brand" href="index.html">Yana Atelier</a><span>Пловдив, България</span></footer><script>(async()=>{const base='/yana-atelier/';const asset=p=>!p?'':(/^https?:\/\//i.test(p)?p:base+p.replace(/^\/+/,''));try{const res=await fetch(base+'content/catalog.json',{cache:'no-store'});if(!res.ok)throw new Error('Catalog HTTP '+res.status);const data=await res.json();const slug=new URLSearchParams(location.search).get('slug');const item=(data.dresses||[]).find(d=>d.slug===slug);const root=document.getElementById('detail');if(!item){root.innerHTML='<p>Моделът не е намерен. <a href="'+base+'">Назад към колекцията</a></p>';return;}document.title=item.name+' — Yana Atelier';const photos=[...new Set([item.image,...(Array.isArray(item.gallery)?item.gallery:[])].filter(Boolean))];let active=0;const gallery='<div class="gallery"><div class="photo gallery-main" id="galleryMain"><img src="'+asset(photos[0]||'')+'" alt="'+item.name+'" id="galleryImage" data-path="'+(photos[0]||'')+'"></div><div class="gallery-controls"><button type="button" id="galleryPrev" aria-label="Предишна снимка">←</button><span id="galleryCount">1 / '+Math.max(photos.length,1)+'</span><button type="button" id="galleryNext" aria-label="Следваща снимка">→</button></div><div class="gallery-thumbs" id="galleryThumbs"></div></div>';root.innerHTML=gallery+'<div><div class="eyebrow">Yana Atelier · Пловдив</div><h1>'+item.name+'</h1><div class="eyebrow">'+(item.category||'Вечерна рокля')+' · Индивидуална изработка</div><div class="price">'+item.price+' €</div><p class="desc">'+(item.longDescription||item.description||'Рокля, създадена индивидуално по твоите мерки.')+'</p><a class="cta" href="'+(data.site?.bookingUrl||'https://www.instagram.com/')+'" target="_blank" rel="noreferrer">Запиши час за консултация ↗</a><div class="details">Изработка по поръчка<br>Индивидуално напасване<br>За информация и записване — свържи се с ателието</div></div>';const showPhoto=i=>{if(!photos.length)return;active=(i+photos.length)%photos.length;const img=document.getElementById('galleryImage');img.dataset.path=photos[active];img.dataset.try='0';img.src=asset(photos[active]);img.onerror=()=>{const p=img.dataset.path||'';const tries=[p.replace(/^\/+/,''),'/'+p.replace(/^\/+/,''),'https://raw.githubusercontent.com/chbvghbvj/yana-atelier/main/'+p.replace(/^\/+/, '')];const n=Number(img.dataset.try||0);if(n<tries.length){img.dataset.try=String(n+1);img.src=tries[n];}};document.getElementById('galleryCount').textContent=(active+1)+' / '+photos.length;document.querySelectorAll('#galleryThumbs button').forEach((b,j)=>b.style.borderColor=j===active?'var(--accent)':'var(--line)');};document.getElementById('galleryPrev').onclick=()=>showPhoto(active-1);document.getElementById('galleryNext').onclick=()=>showPhoto(active+1);document.getElementById('galleryThumbs').innerHTML=photos.map((p,i)=>'<button type="button" aria-label="Снимка '+(i+1)+'" data-index="'+i+'"><img src="'+asset(p)+'" alt=""></button>').join('');document.querySelectorAll('#galleryThumbs button').forEach(b=>b.onclick=()=>showPhoto(Number(b.dataset.index)));showPhoto(0);}catch(e){console.error(e);document.getElementById('detail').innerHTML='<p>Не удалось загрузить каталог. <a href="'+base+'">Назад</a></p>';}})();</script></body></html>
