<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yana Atelier — Рокля</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--paper:#f7f5f1;--ink:#171614;--muted:#77736d;--line:#d9d5ce;--accent:#9b8067}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.nav{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.brand{font:22px 'Playfair Display',serif}.back{color:var(--muted)}main{padding:5vw}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:7vw;align-items:start}.gallery{min-width:0}.gallery-track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;touch-action:pan-y pinch-zoom;scrollbar-width:none;-ms-overflow-style:none;cursor:grab}.gallery-track.is-dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto;user-select:none}.gallery-track.is-dragging img{pointer-events:none}.gallery-track::-webkit-scrollbar{display:none}.gallery-slide{flex:0 0 100%;width:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}.gallery-slide img{display:block;width:100%;height:min(76vh,900px);object-fit:contain;object-position:center;background:transparent}.gallery-dots{display:flex;justify-content:center;align-items:center;gap:8px;padding:15px 0 0}.gallery-dot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#c9c4bc;cursor:pointer}.gallery-dot[aria-current="true"]{background:var(--ink)}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(46px,6vw,82px)/.98 'Playfair Display',serif;letter-spacing:-.04em;margin:20px 0}.price{font-size:14px;margin:24px 0}.desc{font-size:13px;line-height:1.9;color:var(--muted);max-width:390px;white-space:pre-line}.related-version{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;padding:14px 18px;border:1px solid var(--accent);color:var(--accent);font-size:10px;letter-spacing:.1em;text-transform:uppercase;line-height:1.5;transition:background .2s,color .2s}.related-version:hover{background:var(--accent);color:#fff}.cta{display:inline-block;margin-top:24px;padding:15px 22px;background:var(--ink);color:white;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.details{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--muted)}footer{padding:28px 5vw;border-top:1px solid var(--line);font-size:10px;display:flex;justify-content:space-between}@media(max-width:700px){.nav{height:64px}main{padding:24px 5vw}.layout{grid-template-columns:1fr;gap:35px}.gallery-slide img{height:min(68vh,720px)}h1{font-size:58px}}
</style></head><body><header class="nav"><a class="brand" id="homeLink" href="index.html">Yana Atelier</a><a class="back" id="backLink" href="index.html#collection">← Колекция</a></header><main><div class="layout" id="detail"><p>Моделът се зарежда…</p></div></main><footer><a class="brand" id="footerHome" href="index.html">Yana Atelier</a><span>Пловдив, България</span></footer><script>
(async function(){
 const base=location.pathname.indexOf('/yana-atelier/')===0?'/yana-atelier/':'/';
 ['homeLink','backLink','footerHome'].forEach(id=>document.getElementById(id).href=base+(id==='backLink'?'index.html#collection':'index.html'));
 const root=document.getElementById('detail');
 const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const asset=path=>base+String(path||'').replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
 try{
  const response=await fetch(base+'content/catalog.json',{cache:'no-store'});
  if(!response.ok)throw new Error('catalog');
  const catalog=await response.json();
  const slug=new URLSearchParams(location.search).get('slug');
  const item=(catalog.dresses||[]).find(d=>d.slug===slug&&d.published!==false);
  if(!item){root.innerHTML='<p>Моделът не е намерен. <a href="'+base+'index.html#collection">Назад към колекцията</a></p>';return;}
  document.title=item.name+' — Yana Atelier';
  const photos=[item.image,...(item.gallery||[])].filter(Boolean);
  const slides=photos.map((path,index)=>'<div class="gallery-slide"><img src="'+asset(path)+'" alt="'+esc(item.name)+' — снимка '+(index+1)+'" '+(index===0?'fetchpriority="high"':'loading="lazy"')+'></div>').join('');
  const dots=photos.length>1?'<div class="gallery-dots" aria-label="Избери снимка">'+photos.map((path,index)=>'<button class="gallery-dot" type="button" data-slide="'+index+'" aria-label="Снимка '+(index+1)+'" aria-current="'+(index===0?'true':'false')+'"></button>').join('')+'</div>':'';
  root.innerHTML='<div class="gallery"><div class="gallery-track" id="galleryTrack">'+(slides||'<div class="eyebrow">Снимките на модела скоро ще бъдат добавени.</div>')+'</div>'+dots+'</div><div><div class="eyebrow">Yana Atelier · Пловдив</div><h1>'+esc(item.name)+'</h1><div class="eyebrow">'+esc(item.category||'Вечерна рокля')+' · Индивидуална изработка</div><div class="price">'+(Number(item.price)||0)+' €</div><p class="desc">'+esc(item.longDescription||item.description)+'</p>'+(()=>{const related=(catalog.dresses||[]).find(d=>d.slug===item.relatedDressSlug&&d.published!==false);if(!related)return '';const isShort=/коктейл/i.test(related.category||'');const label=(isShort?'Виж късата версия — ':'Виж дългата версия — ')+related.name;return '<a class="related-version" href="'+base+'dress.html?slug='+encodeURIComponent(related.slug)+'">'+esc(label)+' ↗</a>';})()+'<a class="cta" href="'+esc((catalog.site||{}).bookingUrl||'https://ig.me/m/yana.atelier.plovdiv')+'">Запиши час за консултация ↗</a><div class="details">Изработка по поръчка<br>Индивидуално напасване<br>За информация и записване — свържи се с ателието</div></div>';
  const track=document.getElementById('galleryTrack');
  const dotButtons=root.querySelectorAll('.gallery-dot');
  if(track&&dotButtons.length){
   const setActive=()=>{const index=Math.round(track.scrollLeft/track.clientWidth);dotButtons.forEach((dot,i)=>dot.setAttribute('aria-current',String(i===index)));};
   dotButtons.forEach(dot=>dot.addEventListener('click',()=>{track.scrollTo({left:Number(dot.dataset.slide)*track.clientWidth,behavior:'smooth'});}));
   track.addEventListener('scroll',setActive,{passive:true});
   let touchStart=null;
   track.addEventListener('touchstart',event=>{
    if(event.touches.length!==1)return;
    const t=event.touches[0];
    touchStart={x:t.clientX,y:t.clientY,scroll:track.scrollLeft,axis:null};
   },{passive:true});
   track.addEventListener('touchmove',event=>{
    if(!touchStart||event.touches.length!==1)return;
    const t=event.touches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;
    if(!touchStart.axis&&Math.max(Math.abs(dx),Math.abs(dy))>8)touchStart.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(touchStart.axis==='x'){
     event.preventDefault();
     track.classList.add('is-dragging');
     track.scrollLeft=touchStart.scroll-dx;
    }
   },{passive:false});
   const finishTouch=()=>{
    if(!touchStart)return;
    if(touchStart.axis==='x'){
     const delta=touchStart.x-(track.scrollLeft-touchStart.scroll+touchStart.x-touchStart.x);
     const moved=track.scrollLeft-touchStart.scroll;
     const startIndex=Math.round(touchStart.scroll/track.clientWidth);
     let target=startIndex;
     if(Math.abs(moved)>track.clientWidth*.15)target=startIndex+(moved>0?1:-1);
     target=Math.max(0,Math.min(dotButtons.length-1,target));
     track.classList.remove('is-dragging');
     track.scrollTo({left:target*track.clientWidth,behavior:'smooth'});
    }
    touchStart=null;
   };
   track.addEventListener('touchend',finishTouch,{passive:true});
   track.addEventListener('touchcancel',finishTouch,{passive:true});
   window.addEventListener('resize',()=>{const active=[...dotButtons].findIndex(dot=>dot.getAttribute('aria-current')==='true');track.scrollTo({left:Math.max(0,active)*track.clientWidth});});
  }
 }catch(error){root.innerHTML='<p>Каталогът временно не може да се зареди. <a href="'+base+'index.html#collection">Назад към колекцията</a></p>'}
})();
</script></body></html>
