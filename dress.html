<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yana Atelier — Рокля</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--paper:#f7f5f1;--ink:#171614;--muted:#77736d;--line:#d9d5ce;--accent:#9b8067}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.nav{height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.brand{font:22px 'Playfair Display',serif}.back{color:var(--muted)}main{padding:5vw}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:7vw;align-items:start}.gallery img{width:100%;height:auto;display:block;margin-bottom:12px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(46px,6vw,82px)/.98 'Playfair Display',serif;letter-spacing:-.04em;margin:20px 0}.price{font-size:14px;margin:24px 0}.desc{font-size:13px;line-height:1.9;color:var(--muted);max-width:390px}.cta{display:inline-block;margin-top:24px;padding:15px 22px;background:var(--ink);color:white;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.details{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--muted)}footer{padding:28px 5vw;border-top:1px solid var(--line);font-size:10px;display:flex;justify-content:space-between}@media(max-width:700px){.nav{height:64px}main{padding:24px 5vw}.layout{grid-template-columns:1fr;gap:35px}h1{font-size:58px}}</style></head><body><header class="nav"><a class="brand" id="homeLink" href="index.html">Yana Atelier</a><a class="back" id="backLink" href="index.html#collection">← Колекция</a></header><main><div class="layout" id="detail"><p>Моделът се зарежда…</p></div></main><footer><a class="brand" id="footerHome" href="index.html">Yana Atelier</a><span>Пловдив, България</span></footer><script>
(async function(){
 const base=location.pathname.indexOf('/yana-atelier/')===0?'/yana-atelier/':'/';
 ['homeLink','backLink','footerHome'].forEach(id=>document.getElementById(id).href=base+(id==='backLink'?'index.html#collection':'index.html'));
 const root=document.getElementById('detail');
 const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const asset=path=>base+String(path||'').replace(/^\\//,'').split('/').map(encodeURIComponent).join('/');
 try{
  const response=await fetch(base+'content/catalog.json');
  if(!response.ok)throw new Error('catalog');
  const catalog=await response.json();
  const slug=new URLSearchParams(location.search).get('slug');
  const item=(catalog.dresses||[]).find(d=>d.slug===slug&&d.published!==false);
  if(!item){root.innerHTML='<p>Моделът не е намерен. <a href="'+base+'index.html#collection">Назад към колекцията</a></p>';return;}
  document.title=item.name+' — Yana Atelier';
  const photos=[item.image,...(item.gallery||[])].filter(Boolean);
  const gallery=photos.map(path=>'<img src="'+asset(path)+'" alt="'+esc(item.name)+'" loading="lazy">').join('');
  root.innerHTML='<div class="gallery">'+(gallery||'<div class="eyebrow">Снимките на модела скоро ще бъдат добавени.</div>')+'</div><div><div class="eyebrow">Yana Atelier · Пловдив</div><h1>'+esc(item.name)+'</h1><div class="eyebrow">'+esc(item.category||'Вечерна рокля')+' · Индивидуална изработка</div><div class="price">'+(Number(item.price)||0)+' €</div><p class="desc">'+esc(item.longDescription||item.description)+'</p><a class="cta" href="'+esc((catalog.site||{}).bookingUrl||'https://www.instagram.com/')+'" target="_blank" rel="noreferrer">Запиши час за консултация ↗</a><div class="details">Изработка по поръчка<br>Индивидуално напасване<br>За информация и записване — свържи се с ателието</div></div>';
 }catch(error){root.innerHTML='<p>Каталогът временно не може да се зареди. <a href="'+base+'index.html#collection">Назад към колекцията</a></p>'}
})();
</script></body></html>
