name: Catalog browser test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for published catalog
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS https://chbvghbvj.github.io/yana-atelier/ -o /tmp/site.html && grep -q 'categoryFilter' /tmp/site.html; then
              echo "Published catalog is responding."
              exit 0
            fi
            echo "Waiting for GitHub Pages ($attempt/30)..."
            sleep 10
          done
          echo "Published catalog did not respond in time."
          exit 1
      - name: Run category filter test
        run: npx playwright test tests/catalog.spec.js --reporter=line
